<body>
<header class="top">
  <div class="top-in">
    <h1 class="brand">Money</h1>
    <div class="seg side" id="side" role="group" aria-label="Which side">
      <button type="button" data-side="personal" aria-pressed="true">Personal</button>
      <button type="button" data-side="business" aria-pressed="false">Business</button>
    </div>
  </div>
  <p class="synced" id="synced"></p>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#home" data-tab="home">Today</a>
    <a href="#cards" data-tab="cards">Accounts</a>
    <a href="#spend" data-tab="spend">Spending</a>
    <a href="#upcoming" data-tab="upcoming">Upcoming</a>
    <a href="#funds" data-tab="funds">Funds</a>
  </nav>
</header>

<main id="main" class="main">
  <p class="muted pad">Loading…</p>
</main>

<section id="signin" class="signin" hidden>
  <form id="signin-form" class="card narrow">
    <h2>Sign in</h2>
    <p class="muted">Use the email your invite went to.</p>
    <label for="si-email">Email</label>
    <input id="si-email" name="email" type="email" autocomplete="username" required>
    <label for="si-pass">Password</label>
    <input id="si-pass" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Sign in</button>
    <p class="err" id="si-err" hidden></p>
  </form>
</section>

<section id="mfa" class="signin" hidden>
  <form id="mfa-form" class="card narrow">
    <h2 id="mfa-title">Enter your code</h2>
    <p class="muted" id="mfa-help"></p>
    <img id="mfa-qr" class="qr" alt="QR code to add Money to your authenticator app" width="200" height="200" hidden>
    <p class="note" id="mfa-secret" hidden></p>
    <label for="mfa-code">6-digit code</label>
    <input id="mfa-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
    <button class="btn" type="submit">Continue</button>
    <p class="err" id="mfa-err" hidden></p>
    <p class="note"><a href="#" id="signout">Sign out</a></p>
  </form>
</section>
