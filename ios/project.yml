# Money, the iPhone app. Generate the Xcode project with:  xcodegen generate
name: Money
options:
  bundleIdPrefix: com.santiagocast
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7L2VCDH4BS
    CODE_SIGN_STYLE: Automatic

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0

targets:
  Money:
    type: application
    platform: iOS
    sources:
      - path: Money
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Money/Info.plist
      properties:
        CFBundleDisplayName: Money
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "Money uses Face ID to unlock, so nobody who picks up your phone sees your accounts."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.santiagocast.money
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
